name: Lint

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  json:
    name: JSON
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Validate JSON
        run: python3 scripts/lint-json.py
